[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zoomfx"
version = "0.1.0"
description = "Framework para criar e gravar patches na Zoom G1on/G1Xon via USB-MIDI, com efeitos descritos em JSON"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.8"
authors = [{ name = "Matheus Pereira" }]

[project.scripts]
zoomfx = "zoomfx.cli:main"

[tool.setuptools]
packages = ["zoomfx"]

[tool.setuptools.package-data]
zoomfx = ["web/*.html"]
